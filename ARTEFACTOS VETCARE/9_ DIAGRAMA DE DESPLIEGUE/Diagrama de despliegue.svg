<svg viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">VetCare — Diagrama de Despliegue</text>
  <text x="700" y="66" text-anchor="middle" font-size="14" fill="#475569">Arquitectura física: SPA en el navegador + Supabase como Backend-as-a-Service (Auth + PostgREST + Edge Functions + PostgreSQL)</text>

  <!-- ===================== NODO CLIENTE ===================== -->
  <g>
    <!-- 3D node box -->
    <polygon points="60,140 320,140 350,110 350,430 90,430 60,400" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <polygon points="60,140 320,140 350,110 90,110" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <polygon points="320,140 350,110 350,430 320,430" fill="#dde3fb" stroke="#4338ca" stroke-width="2"/>

    <text x="205" y="165" text-anchor="middle" font-size="12" fill="#4338ca" font-style="italic">«device»</text>
    <text x="205" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">Equipo cliente</text>
    <text x="205" y="202" text-anchor="middle" font-size="11" fill="#3730a3">Recepción · Consultorio · Administración</text>

    <line x1="90" y1="215" x2="320" y2="215" stroke="#4338ca" stroke-width="1"/>

    <!-- artifact box -->
    <rect x="90" y="235" width="230" height="90" rx="10" fill="#ffffff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="205" y="255" text-anchor="middle" font-size="11" fill="#4338ca" font-style="italic">«artifact»</text>
    <text x="205" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">VetCare SPA</text>
    <text x="205" y="290" text-anchor="middle" font-size="10.5" fill="#334155">React 19 + TypeScript (Vite) + MUI</text>
    <text x="205" y="305" text-anchor="middle" font-size="10.5" fill="#334155">bundle estático (HTML/JS/CSS)</text>

    <text x="205" y="345" text-anchor="middle" font-size="10.5" fill="#475569">Navegador web actualizado</text>
    <text x="205" y="360" text-anchor="middle" font-size="10.5" fill="#475569">(Chrome / Edge / Firefox)</text>
    <text x="205" y="385" text-anchor="middle" font-size="10" fill="#64748b">Sesión guardada localmente</text>
    <text x="205" y="399" text-anchor="middle" font-size="10" fill="#64748b">(token JWT de Supabase Auth)</text>
  </g>

  <!-- ===================== GRUPO SUPABASE ===================== -->
  <rect x="480" y="95" width="880" height="850" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="920" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Supabase — Backend as a Service (no hay backend propio)</text>

  <!-- ===== Entorno LOCAL (activo hoy) ===== -->
  <g>
    <polygon points="510,150 1330,150 1330,470 510,470" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <polygon points="510,150 1330,150 1330,175 510,175" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="920" y="167" text-anchor="middle" font-size="12" fill="#166534" font-style="italic">«execution environment»</text>

    <text x="530" y="196" font-size="14" font-weight="700" fill="#14532d">Entorno local de desarrollo (Docker Desktop)</text>
    <rect x="1180" y="182" width="130" height="20" rx="10" fill="#16a34a"/>
    <text x="1245" y="196" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="700">ACTIVO HOY</text>
    <text x="530" y="213" font-size="10.5" fill="#166534">Orquestado con Supabase CLI (`npx supabase start`)</text>

    <!-- componentes -->
    <g>
      <rect x="530" y="228" width="170" height="78" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.3"/>
      <text x="615" y="246" text-anchor="middle" font-size="10" fill="#15803d" font-style="italic">«component»</text>
      <text x="615" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#052e16">GoTrue (Auth)</text>
      <text x="615" y="278" text-anchor="middle" font-size="9.5" fill="#334155">Identidad, sesión,</text>
      <text x="615" y="290" text-anchor="middle" font-size="9.5" fill="#334155">ban/activación de cuentas</text>
    </g>
    <g>
      <rect x="720" y="228" width="170" height="78" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.3"/>
      <text x="805" y="246" text-anchor="middle" font-size="10" fill="#15803d" font-style="italic">«component»</text>
      <text x="805" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#052e16">PostgREST</text>
      <text x="805" y="278" text-anchor="middle" font-size="9.5" fill="#334155">API REST autogenerada</text>
      <text x="805" y="290" text-anchor="middle" font-size="9.5" fill="#334155">sobre el esquema public</text>
    </g>
    <g>
      <rect x="910" y="228" width="200" height="78" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.3"/>
      <text x="1010" y="246" text-anchor="middle" font-size="10" fill="#15803d" font-style="italic">«component»</text>
      <text x="1010" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#052e16">Edge Functions (Deno)</text>
      <text x="1010" y="278" text-anchor="middle" font-size="9.5" fill="#334155">admin-usuarios</text>
      <text x="1010" y="290" text-anchor="middle" font-size="9.5" fill="#334155">(usa service_role key)</text>
    </g>
    <g>
      <rect x="1130" y="228" width="180" height="78" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="1220" y="246" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">«tool» (solo inspección)</text>
      <text x="1220" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Supabase Studio</text>
      <text x="1220" y="278" text-anchor="middle" font-size="9.5" fill="#334155">Consulta visual de datos,</text>
      <text x="1220" y="290" text-anchor="middle" font-size="9.5" fill="#334155">no para cambios de estructura</text>
    </g>

    <!-- PostgreSQL -->
    <g>
      <ellipse cx="920" cy="333" rx="380" ry="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
      <path d="M540,333 L540,405 A380,14 0 0 0 1300,405 L1300,333" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
      <ellipse cx="920" cy="405" rx="380" ry="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
      <text x="920" y="355" text-anchor="middle" font-size="11" fill="#1d4ed8" font-style="italic">«database»</text>
      <text x="920" y="372" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">PostgreSQL</text>
      <text x="920" y="388" text-anchor="middle" font-size="10.5" fill="#1e3a8a">15 tablas · Row Level Security · triggers · funciones SECURITY DEFINER · vistas</text>
    </g>

    <text x="530" y="452" font-size="10" fill="#166534">Datos de prueba: `supabase/seed.sql` (3 cuentas de rol) — nunca contra datos reales</text>
  </g>

  <!-- conexiones internas dentro del entorno local -->
  <line x1="615" y1="306" x2="720" y2="325" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="805" y1="306" x2="850" y2="325" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="1010" y1="306" x2="990" y2="325" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="960" y="318" text-anchor="middle" font-size="9" fill="#166534">SQL / libpq (interno)</text>

  <!-- ===== Entorno CLOUD (pendiente) ===== -->
  <g opacity="0.92">
    <polygon points="510,505 1330,505 1330,910 510,910" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
    <polygon points="510,505 1330,505 1330,530 510,530" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="920" y="521" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">«execution environment»</text>

    <text x="530" y="551" font-size="14" font-weight="700" fill="#334155">Proyecto Supabase Cloud (alojado)</text>
    <rect x="1120" y="537" width="190" height="20" rx="10" fill="#94a3b8"/>
    <text x="1215" y="551" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="700">PENDIENTE DE VINCULAR</text>
    <text x="530" y="568" font-size="10.5" fill="#64748b">Objetivo de despliegue — mismo stack gestionado por Supabase</text>

    <g>
      <rect x="530" y="583" width="220" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="640" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">GoTrue (Auth)</text>
      <text x="640" y="622" text-anchor="middle" font-size="9.5" fill="#64748b">gestionado por Supabase</text>
    </g>
    <g>
      <rect x="770" y="583" width="220" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="880" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">PostgREST</text>
      <text x="880" y="622" text-anchor="middle" font-size="9.5" fill="#64748b">gestionado por Supabase</text>
    </g>
    <g>
      <rect x="1010" y="583" width="280" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="1150" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Edge Functions + PostgreSQL</text>
      <text x="1150" y="622" text-anchor="middle" font-size="9.5" fill="#64748b">mismas migraciones versionadas</text>
    </g>

    <rect x="530" y="663" width="760" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="550" y="686" font-size="12" font-weight="700" fill="#334155">Para activar este entorno (pendiente):</text>
    <text x="550" y="708" font-size="11" fill="#475569">1. `npx supabase link --project-ref &lt;ref&gt;`  — vincula este repo a un proyecto Supabase alojado</text>
    <text x="550" y="728" font-size="11" fill="#475569">2. `npx supabase db push`  — aplica todas las migraciones versionadas de `supabase/migrations/`</text>
    <text x="550" y="748" font-size="11" fill="#475569">3. Publicar el build de la SPA (`npm run build`) en un hosting estático apuntando a las URLs del proyecto alojado</text>
    <text x="550" y="768" font-size="11" fill="#475569">4. Definir con el cliente los TBD de RNF-016/018/019 (tiempo de respuesta, disponibilidad, respaldo) antes de ir a producción</text>
    <text x="550" y="785" font-size="10" fill="#94a3b8" font-style="italic">Nunca ejecutar `seed.sql` contra este entorno: contendría cuentas y datos de prueba, no reales.</text>

    <text x="530" y="825" font-size="10.5" fill="#64748b">`supabase/migrations/` es, en la práctica, el "backend" versionado de este proyecto —</text>
    <text x="530" y="842" font-size="10.5" fill="#64748b">tanto el entorno local como el alojado se construyen desde el mismo conjunto de migraciones SQL.</text>
  </g>

  <!-- ===================== FLECHAS CLIENTE -> ENTORNOS ===================== -->
  <path d="M350,270 C420,270 440,270 505,260" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="425" y="253" text-anchor="middle" font-size="10.5" fill="#1e293b" font-weight="600">HTTPS / JSON</text>
  <text x="425" y="266" text-anchor="middle" font-size="9.5" fill="#334155">token de sesión (Bearer JWT)</text>
  <text x="425" y="279" text-anchor="middle" font-size="9" fill="#166534">activo — desarrollo</text>

  <path d="M350,340 C420,400 440,450 505,610" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowDashed)"/>
  <text x="440" y="470" text-anchor="middle" font-size="10.5" fill="#475569" font-weight="600">HTTPS / JSON</text>
  <text x="440" y="484" text-anchor="middle" font-size="9.5" fill="#64748b">token de sesión (Bearer JWT)</text>
  <text x="440" y="498" text-anchor="middle" font-size="9" fill="#94a3b8">objetivo — producción (pendiente)</text>

  <!-- ===================== LEYENDA ===================== -->
  <g>
    <rect x="60" y="500" width="360" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="80" y="527" font-size="13" font-weight="700" fill="#1e293b">Leyenda</text>

    <polygon points="80,540 130,540 138,533 138,562 88,562 80,555" fill="#eef2ff" stroke="#4338ca" stroke-width="1.3"/>
    <text x="150" y="555" font-size="10.5" fill="#334155">Nodo físico (equipo cliente)</text>

    <polygon points="80,578 138,578 138,600 80,600" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
    <text x="150" y="593" font-size="10.5" fill="#334155">Entorno de ejecución (Docker / Cloud)</text>

    <rect x="80" y="612" width="58" height="26" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.3"/>
    <text x="150" y="629" font-size="10.5" fill="#334155">Componente de software (Auth, API, funciones)</text>

    <ellipse cx="109" cy="662" rx="29" ry="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <path d="M80,662 L80,672 A29,8 0 0 0 138,672 L138,662" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="150" y="670" font-size="10.5" fill="#334155">Base de datos (PostgreSQL)</text>

    <line x1="80" y1="695" x2="138" y2="695" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="150" y="699" font-size="10.5" fill="#334155">Comunicación activa hoy</text>

    <line x1="80" y1="720" x2="138" y2="720" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowDashed)"/>
    <text x="150" y="724" font-size="10.5" fill="#334155">Comunicación / entorno objetivo (aún no configurado)</text>

    <text x="80" y="756" font-size="10.5" font-weight="700" fill="#1e293b">No existe backend propio:</text>
    <text x="80" y="772" font-size="10" fill="#475569">toda la lógica de servicios y datos</text>
    <text x="80" y="786" font-size="10" fill="#475569">vive en Supabase (PostgREST + Postgres).</text>

    <text x="80" y="822" font-size="9.5" fill="#94a3b8">VetCare · Estado al 2026-08-26</text>
  </g>
</svg>
