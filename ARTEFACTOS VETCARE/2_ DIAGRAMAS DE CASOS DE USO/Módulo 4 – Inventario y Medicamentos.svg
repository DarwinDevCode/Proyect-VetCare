  <text x="500" y="430.4" text-anchor="middle" font-size="10.5" fill="#0f172a">entre dosis de vacuna</text>
  <ellipse cx="800" cy="420" rx="110.0" ry="40.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
