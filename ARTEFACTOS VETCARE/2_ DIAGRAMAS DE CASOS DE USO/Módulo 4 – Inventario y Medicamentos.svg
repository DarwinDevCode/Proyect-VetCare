  <text x="80" y="550" text-anchor="start" font-size="9" fill="#94a3b8">Nota: "Notificar stock bajo nivel mínimo" no tiene asociación directa con ningún actor (ya era así en el</text>
  <text x="80" y="563" text-anchor="start" font-size="9" fill="#94a3b8">diagrama original) — dos operaciones distintas pueden extenderla: un ajuste manual (Administrador) o un</text>
  <text x="80" y="576" text-anchor="start" font-size="9" fill="#94a3b8">consumo durante una consulta (Veterinario). "Registrar lote..." y "Configurar intervalo..." son opcionales</text>
  <text x="80" y="589" text-anchor="start" font-size="9" fill="#94a3b8">(solo aplican a un ingreso o a un producto tipo vacuna, respectivamente) — por eso son &lt;&lt;Extend&gt;&gt;, no &lt;&lt;Include&gt;&gt;.</text>
  </svg>