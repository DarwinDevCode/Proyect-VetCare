<svg viewBox="0 0 1150 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="uc_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#334155" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1150" height="480" fill="#ffffff"/>
  <rect x="60" y="15" width="1030" height="380" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <text x="575.0" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Módulo 3 – Historial Clínico</text>
  <g stroke="#1e293b" stroke-width="1.4" fill="none">
      <circle cx="50" cy="250" r="9" fill="#ffffff"/>
      <line x1="50" y1="259" x2="50" y2="288"/>
      <line x1="37" y1="268" x2="63" y2="268"/>
      <line x1="50" y1="288" x2="38" y2="312"/>
      <line x1="50" y1="288" x2="62" y2="312"/>
    </g>
  <text x="50" y="344" text-anchor="middle" font-size="11" fill="#0f172a">Veterinario</text>
  <ellipse cx="300" cy="90" rx="170.0" ry="40.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <text x="300" y="87.4" text-anchor="middle" font-size="10.5" fill="#0f172a">Consultar historial</text>
  <text x="300" y="100.4" text-anchor="middle" font-size="10.5" fill="#0f172a">clínico del paciente</text>
  <ellipse cx="650" cy="90" rx="150.0" ry="35.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <text x="650" y="93.9" text-anchor="middle" font-size="10.5" fill="#0f172a">Registrar consulta clínica</text>
  <ellipse cx="480" cy="260" rx="140.0" ry="40.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <text x="480" y="257.4" text-anchor="middle" font-size="10.5" fill="#0f172a">Registrar aplicación</text>
  <text x="480" y="270.4" text-anchor="middle" font-size="10.5" fill="#0f172a">de vacuna</text>
  <ellipse cx="850" cy="260" rx="150.0" ry="40.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <text x="850" y="257.4" text-anchor="middle" font-size="10.5" fill="#0f172a">Registrar examen de</text>
  <text x="850" y="270.4" text-anchor="middle" font-size="10.5" fill="#0f172a">laboratorio</text>
  <path d="M650,125.0 L650,170.0 L480,170.0 L480,220.0" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#uc_arrow)"/>
  <rect x="527.0" y="163.0" width="76" height="14" fill="#ffffff"/>
  <text x="565.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#0f172a">&lt;&lt;Extend&gt;&gt;</text>
  <path d="M650,125.0 L650,170.0 L850,170.0 L850,220.0" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#uc_arrow)"/>
  <rect x="712.0" y="163.0" width="76" height="14" fill="#ffffff"/>
  <text x="750.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#0f172a">&lt;&lt;Extend&gt;&gt;</text>
  <path d="M50.0,315.0 L300.0,315.0 L300.0,130.0" fill="none" stroke="#1e293b" stroke-width="1"/>
  <path d="M50.0,325.0 L650.0,325.0 L650.0,125.0" fill="none" stroke="#1e293b" stroke-width="1"/>
  <path d="M50.0,335.0 L480.0,335.0 L480.0,300.0" fill="none" stroke="#1e293b" stroke-width="1"/>
  <path d="M50.0,345.0 L850.0,345.0 L850.0,300.0" fill="none" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="430" text-anchor="start" font-size="9" fill="#94a3b8">Nota: "Registrar consulta clínica" extiende a "Registrar aplicación de vacuna" y a "Registrar examen de</text>
  <text x="80" y="443" text-anchor="start" font-size="9" fill="#94a3b8">laboratorio" porque el vínculo con una consulta es opcional (RF-018/RF-019): ambas pueden registrarse</text>
  <text x="80" y="456" text-anchor="start" font-size="9" fill="#94a3b8">dentro de una consulta o de forma independiente — por eso es &lt;&lt;Extend&gt;&gt;, no &lt;&lt;Include&gt;&gt;.</text>
  </svg>
