  <text x="80" y="440" text-anchor="start" font-size="9" fill="#94a3b8">Nota: "Gestionar acceso al portal del propietario" cubre tanto la emisión (correo + contraseña inicial) como</text>
  <text x="80" y="453" text-anchor="start" font-size="9" fill="#94a3b8">el reenvío (contraseña nueva) — misma pantalla, mismo botón contextual según si el propietario ya tiene acceso.</text>
  <text x="80" y="471" text-anchor="start" font-size="9" fill="#94a3b8">El alta automática de acceso al registrar un paciente nuevo (si el propietario dejó correo) no es un caso de uso</text>
  <text x="80" y="484" text-anchor="start" font-size="9" fill="#94a3b8">iniciado por el actor, por lo que no se representa aquí — es un efecto colateral de "Registrar paciente".</text>
  </svg>