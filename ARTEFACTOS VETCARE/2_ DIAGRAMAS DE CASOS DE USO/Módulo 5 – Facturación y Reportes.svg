<svg viewBox="0 0 1340 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="uc_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#334155" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1340" height="560" fill="#ffffff"/>
  <rect x="60" y="15" width="1180" height="430" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <text x="650.0" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Módulo 5 – Facturación y Reportes</text>
  <g stroke="#1e293b" stroke-width="1.4" fill="none">
      <circle cx="50" cy="280" r="9" fill="#ffffff"/>
      <line x1="50" y1="289" x2="50" y2="318"/>
      <line x1="37" y1="298" x2="63" y2="298"/>
      <line x1="50" y1="318" x2="38" y2="342"/>
      <line x1="50" y1="318" x2="62" y2="342"/>
    </g>
  <text x="50" y="374" text-anchor="middle" font-size="11" fill="#0f172a">Recepcionista</text>
  <g stroke="#1e293b" stroke-width="1.4" fill="none">
      <circle cx="1290" cy="280" r="9" fill="#ffffff"/>
      <line x1="1290" y1="289" x2="1290" y2="318"/>
      <line x1="1277" y1="298" x2="1303" y2="298"/>
      <line x1="1290" y1="318" x2="1278" y2="342"/>
      <line x1="1290" y1="318" x2="1302" y2="342"/>
    </g>
  <text x="1290" y="374" text-anchor="middle" font-size="11" fill="#0f172a">Administrador</text>
  <ellipse cx="280" cy="100" rx="150.0" ry="35.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <text x="280" y="103.9" text-anchor="middle" font-size="10.5" fill="#0f172a">Generar factura de atención</text>
  <ellipse cx="650" cy="100" rx="140.0" ry="35.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <text x="650" y="103.9" text-anchor="middle" font-size="10.5" fill="#0f172a">Registrar pago de factura</text>
  <ellipse cx="1010" cy="100" rx="150.0" ry="35.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <text x="1010" y="103.9" text-anchor="middle" font-size="10.5" fill="#0f172a">Consultar facturas emitidas</text>
  <ellipse cx="830" cy="280" rx="140.0" ry="40.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <text x="830" y="277.4" text-anchor="middle" font-size="10.5" fill="#0f172a">Generar reporte de</text>
  <text x="830" y="290.4" text-anchor="middle" font-size="10.5" fill="#0f172a">ingresos por período</text>
  <path d="M790,100.0 L860,100.0" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#uc_arrow)"/>
  <rect x="787.0" y="93.0" width="76" height="14" fill="#ffffff"/>
  <text x="825.0" y="104.0" text-anchor="middle" font-size="9.5" fill="#0f172a">&lt;&lt;Include&gt;&gt;</text>
  <path d="M50.0,345.0 L280.0,345.0 L280.0,135.0" fill="none" stroke="#1e293b" stroke-width="1"/>
  <path d="M50.0,355.0 L650.0,355.0 L650.0,135.0" fill="none" stroke="#1e293b" stroke-width="1"/>
  <path d="M50.0,365.0 L990.0,365.0 L990.0,132.0" fill="none" stroke="#1e293b" stroke-width="1"/>
  <path d="M1290.0,360.0 L1030.0,360.0 L1030.0,132.0" fill="none" stroke="#1e293b" stroke-width="1"/>
  <path d="M1290.0,370.0 L830.0,370.0 L830.0,320.0" fill="none" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="475" text-anchor="start" font-size="9" fill="#94a3b8">Nota: "Registrar pago de factura" incluye "Consultar facturas emitidas" porque el saldo propuesto por</text>
  <text x="80" y="488" text-anchor="start" font-size="9" fill="#94a3b8">defecto y la situación de cobro (RN-015) se leen de la factura ya emitida antes de registrar el cobro —</text>
  <text x="80" y="501" text-anchor="start" font-size="9" fill="#94a3b8">es un paso obligatorio, no opcional, por eso es &lt;&lt;Include&gt;&gt;, no &lt;&lt;Extend&gt;&gt;.</text>
  </svg>
